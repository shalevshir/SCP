[tool.poetry]
name = "scp"
version = "0.1.0"
description = "Shir Capital Partners Trading Bot — Phase 1 Infrastructure"
authors = ["Shalev <dev@example.com>"]
packages = [
    { include = "scp", from = "src" },
    { include = "common" },
    { include = "data_layer" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pyyaml = "^6.0.2"
pydantic = "^2.9.0"
pandas = "^2.0.3"
numpy = "^1.26.0"
databento = "^0.40.0"
dash = "^2.14.0"
dash-bootstrap-components = "^1.5.0"
plotly = "^5.18.0"
ib-insync = "^0.9.86"
prometheus-client = "^0.24.1"
scp-shared = { path = "services/shared", develop = true }
matplotlib = "^3.10.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-xdist = "^3.6.1"
pytest-cov = "^5.0.0"
mypy = "^1.11.0"
ruff = "^0.6.9"
black = "^24.8.0"
isort = "^5.13.2"
types-PyYAML = "^6.0.12"
pandas-stubs = "^2.1.4"
pytest-asyncio = "^1.3.0"
redis = "^7.1.0"
requests = "^2.32.5"
asyncpg = "^0.31.0"
fakeredis = "^2.33.0"
httpx = "^0.28.1"
scipy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"
lint.select = ["E","F","I","N","UP","B"]
src = ["src"]
exclude = [".venv",".git","build","dist"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["common", "data_layer", "src"]
omit = ["tests/*", "*/test_*.py", "*/__pycache__/*"]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
precision = 2

