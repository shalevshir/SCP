# Setup Configuration for SCP Trading Bot
# Defines setups, their constraints (via expressions), and scoring weights.
#
# Each setup can be enabled/disabled, has constraints that must ALL pass,
# and factor weights for scoring.
#
# Expressions use Python syntax and have access to:
# - Feature values: rsi, close, vwap, structure_clarity, etc.
# - HTF bias values: htf_direction, htf_liquidity_sweep_detected, htf_structure_1h, etc.
# - Computed values: direction, body, lower_wick, upper_wick, etc.

setups:
  # ============================================================================
  # VWAP_RECLAIM: Reclaim setup after price sweeps and reclaims VWAP
  # ============================================================================
  VWAP_RECLAIM:
    enabled: true
    min_score: 8.0

    # Constraints - ALL must pass for setup to be detected
    # Safety gates (hard rejection) - prevent structurally invalid setups
    # Note: ATR-normalized deviation (≥0.5 ATR) filters micro-fakeouts and chop
    constraints:
      structure_1h_available:
        expression: "structure_1h is not None and structure_1h != ''"
        reject_reason: "HTF 1H structure missing - cannot validate HTF alignment"

      htf_structure_integrity:
        expression: "(direction != 'long' or structure_1h in ('HH', 'HL')) and (direction != 'short' or structure_1h in ('LL', 'LH'))"
        reject_reason: "HTF structure no longer intact for reclaim"

      structure_label_available:
        expression: "structure_label is not None"
        reject_reason: "No structure label available - cannot safely manage trade"

      vwap_reclaim_distance:
        expression: "max_abs_deviation_last_20 is None or (max_abs_deviation_last_20 >= 0.5 and max_abs_deviation_last_20 <= 12.0)"
        reject_reason: "VWAP reclaim invalid - no prior excursion from VWAP (must be 0.5-12.0 ATR away in last 20 bars)"

      vwap_reclaim_current_distance:
        expression: "vwap_deviation_normalized is None or abs(vwap_deviation_normalized) <= 3.0"
        reject_reason: "VWAP reclaim invalid - currently too far from VWAP (must be within 3.0 ATR)"

      # NOTE: BOS constraints moved to SCORING-ONLY (2024-02 optimization)
      # BOS = regime confirmation (score bonus), not entry timing (hard gate)
      # EDA showed bos_age mean of 542 bars - BOS too stale to be a reliable hard gate
      # Scoring handles: bos_recency_bonus, late_reclaim_penalty, bos_direction_penalty
      #
      # REMOVED hard gates:
      # - no_late_reclaim: "bos_recent is not True or bos_age >= 20"
      # - bos_reclaim_gate: "bos_direction == direction or bos_age >= 20"
      # - direction_bos_alignment: "bos_direction == direction or bos_age > 15 or CHoCH override"

      no_structure_conflict:
        expression: "not conflict_detected"
        reject_reason: "HTF structure conflict detected"

      min_vwap_acceptance:
        # Rolling count of bars near VWAP in last 20 bars
        # >= 2 is selective (P75=1, P95=6) but blocks drive-by reclaims (count=0)
        expression: "near_vwap_count_last_20 is None or near_vwap_count_last_20 >= 2"
        reject_reason: "No meaningful VWAP acceptance in last 20 bars"

      #reclaim_timing_gate:
        # Relaxed from 10 to 30 bars based on EDA showing median bars_since_last_vwap_touch of 130
      #  expression: "bars_since_last_vwap_touch is None or bars_since_last_vwap_touch <= 30"
      #  reject_reason: "VWAP reclaim too delayed - invalid continuation"

      structure_label_direction_long:
        expression: "direction != 'long' or structure_label is None or structure_label not in ('LH', 'LL')"
        reject_reason: "Bearish micro structure conflicts with long direction"

      structure_label_direction_short:
        expression: "direction != 'short' or structure_label is None or structure_label not in ('HH', 'HL')"
        reject_reason: "Bullish micro structure conflicts with short direction"

    # Factor weights for scoring (sum to ~10 max)
    weights:
      structure_alignment: 2.5
      vwap_relation: 2.0
      rsi_state: 1.5
      ema_stack: 1.5
      dxy_corr: 1.0
      fvg_alignment: 0.5
      liquidity_sweep: 0.5
      htf_bonus: 0.5

    # Parameters used by factor calculators and penalties
    params:
      bos_recency_threshold: 15
      clarity_high: 0.7
      clarity_moderate: 0.5
      clarity_low: 0.4
      expansion_gate:
        bos_recency_threshold: 10
        range_expansion_ratio: 1.5
        atr_expansion_threshold: 0.7
        displacement_body_ratio: 2.0

  # ============================================================================
  # VWAP_FADE: Counter-trend setup at extreme deviation
  # ============================================================================
  VWAP_FADE:
    enabled: true
    min_score: 8.0

    constraints:
      has_liquidity_sweep:
        expression: "htf_liquidity_sweep_detected or liquidity_sweep"
        reject_reason: "No liquidity sweep detected"

      has_rejection_wick_long:
        expression: "direction != 'long' or (body is not None and lower_wick is not None and lower_wick > body * 1.3)"
        reject_reason: "Long fade requires lower wick > 1.3x body"

      has_rejection_wick_short:
        expression: "direction != 'short' or (body is not None and upper_wick is not None and upper_wick > body * 1.3)"
        reject_reason: "Short fade requires upper wick > 1.3x body"

      min_clarity:
        expression: "structure_clarity >= 0.4"
        reject_reason: "Structure clarity too low for fade"

      trend_weakening:
        expression: "choch_detected or trend_confidence < 0.65"
        reject_reason: "No trend weakening signal (CHoCH or low trend confidence)"

      correct_swing_context_long:
        expression: "direction != 'long' or last_structure_label == 'LH'"
        reject_reason: "Long fade requires LH (lower high) structure"

      correct_swing_context_short:
        expression: "direction != 'short' or last_structure_label == 'HL'"
        reject_reason: "Short fade requires HL (higher low) structure"

      rsi_extreme:
        expression: "rsi < 40 or rsi > 60"
        reject_reason: "RSI not at extreme levels"

      vwap_deviation:
        expression: "vwap_deviation is None or vwap_deviation > 0.25"
        reject_reason: "VWAP deviation too small for fade"

      valid_direction:
        expression: "direction in ('long', 'short')"
        reject_reason: "Invalid direction for fade setup"

    weights:
      vwap_deviation: 3.0
      rsi_extreme: 3.0
      rejection_candle: 2.0
      volume_spike: 2.0

    params:
      wick_body_ratio: 1.3
      rsi_oversold: 40
      rsi_overbought: 60
      vwap_deviation_threshold: 0.25
      clarity_threshold: 0.4
      trend_conf_threshold: 0.65

  # ============================================================================
  # DXY_CONTINUATION: Gold trade aligned with DXY inverse correlation
  # ============================================================================
  DXY_CONTINUATION:
    enabled: true
    min_score: 7.5  # Lowered from 8.0 to allow more setups with score-based filtering

    # HARD CONSTRAINTS (Non-negotiable - structural validity only)
    constraints:
      valid_direction:
        expression: "direction in ('long', 'short')"
        reject_reason: "Invalid direction for continuation"

      # HARD: Gold structure must be present and aligned with direction
      gold_structure_required:
        expression: "last_structure_label is not None"
        reject_reason: "Gold structure missing - cannot validate direction alignment"

      gold_structure_long:
        expression: "direction != 'long' or last_structure_label in ('HH', 'HL')"
        reject_reason: "Gold structure contradicts long direction (need HH/HL, got {last_structure_label})"

      gold_structure_short:
        expression: "direction != 'short' or last_structure_label in ('LH', 'LL')"
        reject_reason: "Gold structure contradicts short direction (need LH/LL, got {last_structure_label})"

      # HARD: Reject if DXY correlation is POSITIVE (contradictory to inverse relationship)
      # Soft threshold handled in scoring, but hard reject positive correlation
      no_positive_dxy_correlation:
        expression: "(dxy_corr_1m is None or dxy_corr_1m < 0.1) and (dxy_corr_5m is None or dxy_corr_5m < 0.1)"
        reject_reason: "DXY correlation is positive - contradicts inverse relationship (1m: {dxy_corr_1m}, 5m: {dxy_corr_5m})"

      # NOTE: DXY structure alignment moved to SCORING-ONLY (dxy_structure_bonus)
      # Per Enforced Correction: DXY structure label should not be a hard gate
      # Rationale: In continuation, DXY often ranges/pauses while gold trends

      # HARD: Wick-chop / fakeout chop (not general pause/consolidation)
      # Redefined: reject if heavy wick chop (wicks dominate body, suggesting indecision)
      no_wick_chop:
        expression: "not is_chop or (body is not None and lower_wick is not None and upper_wick is not None and (lower_wick + upper_wick) / max(body, 0.1) < 3.0)"
        reject_reason: "Wick-chop detected - excessive wicks indicate fakeout regime"

      # HTF bias alignment (if available - allow None to pass, penalize in scoring)
      # HARD reject only if HTF bias exists AND contradicts direction
      no_contradicting_htf_bias:
        expression: "htf_direction is None or htf_direction == direction or htf_direction == 'neutral'"
        reject_reason: "HTF bias contradicts direction (htf: {htf_direction}, direction: {direction})"

    # SOFT CONSTRAINTS (Score-based - handled in scoring factors, not hard rejection)
    # Per Enforced Correction from dxy_continuation_config_review_insights.md:
    # - dxy_structure_bonus: Bonus if DXY structure aligned (was hard constraint)
    # - dual_correlation_strength: Score bonus for strong correlation (< -0.3)
    # - bos_recency: Bonus if BOS within 15 bars
    # - min_clarity: Bonus if clarity >= 0.5

    weights:
      structure_alignment: 2.5   # Gold structure quality + HTF alignment
      dxy_corr: 3.5              # Increased - primary edge for this setup
      dxy_structure_bonus: 1.0   # NEW - bonus for aligned DXY structure (was hard constraint)
      bos_recency_bonus: 1.0     # Bonus for fresh BOS (scoring-only)
      clarity_bonus: 1.0         # Bonus for high clarity (scoring-only)
      rsi_mid_reset: 1.0         # RSI returning to midline (50)
      vwap_relation: 1.0         # Position relative to VWAP
      ema_stack: 0.5             # EMA alignment
      fvg_alignment: 0.5         # FVG present and aligned

    params:
      # Correlation scoring thresholds
      correlation_strong: -0.5      # Score 1.0 if both < -0.5
      correlation_moderate: -0.3    # Score 0.6 if both < -0.3
      correlation_weak: -0.15       # Score 0.3 if both < -0.15

      # BOS recency scoring
      bos_fresh_threshold: 10       # Full bonus if BOS within 10 bars
      bos_recent_threshold: 20      # Partial bonus if BOS within 20 bars

      # Clarity scoring
      clarity_excellent: 0.7        # Full bonus
      clarity_good: 0.5             # Partial bonus
      clarity_acceptable: 0.3       # Minimal bonus

      # Wick-chop detection
      wick_body_ratio_threshold: 3.0  # Reject if total_wick/body > 3.0

# Global confidence thresholds
confidence:
  a_plus: 7.8      # Score >= 7.5 -> A+ (tradeable) - LOWERED FROM 8.0
  watch: 6.0       # Score 6.0-7.4 -> Watch (monitor only)
  reject: 0.0      # Score < 6.0 -> Reject (invalid)

# VWAP_RECLAIM expansion gate configuration
# Controls entry timing by requiring expansion signals before execution
vwap_reclaim:
  expansion_gate:
    bos_recency_threshold: 10      # bars - BOS must be within this for full readiness
    range_expansion_ratio: 1.5     # current range vs median - signals volatility expansion
    atr_expansion_threshold: 0.7   # ATR ratio must exceed this - signals rising volatility
    displacement_body_ratio: 2.0   # body vs average body - signals strong momentum

# SOP validation requirements
validation:
  # DXY correlation threshold for Gold trades
  dxy_corr_threshold: -0.6  # Must be < -0.6 for valid inverse correlation

  # Multi-window DXY correlation weights
  # Used for enhanced correlation analysis across multiple timeframes
  # Weights must sum to 1.0
  dxy_multiwindow_weights:
    15min: 0.5   # Short-term correlation (recent relationship)
    30min: 0.3   # Medium-term correlation
    60min: 0.2   # Long-term correlation (macro trend)

  # Session definitions (used for session validation)
  sessions:
    asia: { start: "00:00", end: "08:00" }
    london: { start: "03:00", end: "12:00" }
    ny: { start: "08:00", end: "17:00" }

  # Tier-based risk management
  tiers:
    Conservative: { max_risk_per_trade: 0.01, max_daily_drawdown: 0.02 }
    Moderate: { max_risk_per_trade: 0.015, max_daily_drawdown: 0.03 }
    Aggressive: { max_risk_per_trade: 0.02, max_daily_drawdown: 0.04 }
