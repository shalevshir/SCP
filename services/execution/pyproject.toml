[tool.poetry]
name = "scp-execution"
version = "0.1.0"
description = "Execution Service - Trade lifecycle and broker integration"
authors = ["Shalev <dev@example.com>"]
packages = [
    { include = "execution_svc", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
scp-shared = {path = "../shared", develop = true}
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
redis = {extras = ["hiredis"], version = "^5.0.0"}
ibapi = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "../shared/src"]
reportMissingImports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

