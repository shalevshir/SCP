[tool.poetry]
name = "scp-bot-core"
version = "0.1.0"
description = "Bot Core Service - Signal generation and guardrails"
authors = ["Shalev <dev@example.com>"]
packages = [
    { include = "bot_core_svc", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
scp-shared = {path = "../shared", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

