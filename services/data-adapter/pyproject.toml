[tool.poetry]
name = "scp-data-adapter"
version = "0.1.0"
description = "Data Adapter Service - Live data ingestion and normalization"
authors = ["Shalev <dev@example.com>"]
packages = [
    { include = "data_adapter", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
scp-shared = {path = "../shared", develop = true}
databento = "^0.40.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
mypy = "^1.11.0"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
lint.select = ["E","F","I","N","UP","B"]

