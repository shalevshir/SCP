[tool.poetry]
name = "scp-feature-engine"
version = "0.1.0"
description = "Feature Engine Service - Indicator computation"
authors = ["Shalev <dev@example.com>"]
packages = [
    { include = "feature_engine_svc", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
scp-shared = {path = "../shared", develop = true}
pandas = "^2.0.3"
numpy = "^1.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
mypy = "^1.11.0"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

