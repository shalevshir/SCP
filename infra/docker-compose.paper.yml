# Paper Trading Environment Overrides
# Usage: docker compose -f docker-compose.infra.yml -f docker-compose.services.yml -f docker-compose.paper.yml up --build
#
# Features:
# - Live market data via IB Gateway
# - IB Gateway paper trading broker
# - Production-like settings but safe for testing
# - Session filtering enabled
# - Full risk management and guardrails
#
# Prerequisites:
# 1. IB Gateway running on host machine in paper trading mode (port 4002)
# 2. IB API enabled in Gateway settings

services:
  data-adapter:
    container_name: scp-data-adapter-paper
    environment:
      SERVICE_MODE: paper
      DATA_PROVIDER: ib
      IB_HOST: ib-gateway
      IB_PORT: ${IB_PORT:-4004}  # Paper trading port (Docker IB Gateway)
      IB_CLIENT_ID: ${IB_CLIENT_ID:-1}
      IB_GC_CONTRACT: ${IB_GC_CONTRACT:-GC}
      IB_DXY_CONTRACT: ${IB_DXY_CONTRACT:-DX}
      SESSION_FILTER_ENABLED: "true"
      GAP_BACKFILL_ENABLED: "true"
      RECONNECT_MAX_RETRIES: 10
      RECONNECT_BASE_DELAY: 1.0
      RECONNECT_MAX_DELAY: 60.0
      LOG_LEVEL: INFO
    depends_on:
      ib-gateway:
        condition: service_healthy

  feature-engine:
    container_name: scp-feature-engine-paper
    environment:
      SERVICE_MODE: paper
      LOG_LEVEL: INFO

  htf-bias:
    container_name: scp-htf-bias-paper
    environment:
      SERVICE_MODE: paper
      LOG_LEVEL: INFO

  bot-core:
    container_name: scp-bot-core-paper
    environment:
      SERVICE_MODE: paper
      SESSION_VALIDATION_ENABLED: "true"
      LOG_LEVEL: INFO

  execution:
    container_name: scp-execution-paper
    environment:
      SERVICE_MODE: paper
      BROKER_MODE: ib_paper
      IB_HOST: ib-gateway
      IB_PORT: ${IB_PORT:-4004}  # Paper trading port (Docker IB Gateway)
      IB_CLIENT_ID: ${IB_CLIENT_ID:-2}  # Different client ID than data adapter
      IB_ACCOUNT: ${IB_ACCOUNT:-}
      LOG_LEVEL: INFO
    depends_on:
      ib-gateway:
        condition: service_healthy

  # Override Prometheus to scrape Docker service names (not host.docker.internal)
  prometheus:
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
