# Test Environment Overrides
# Usage: docker compose -f docker-compose.infra.yml -f docker-compose.services.yml -f docker-compose.test.yml up --build
#
# Ephemeral containers for CI/testing - no persistent volumes, different ports

services:
  # Infrastructure overrides for testing
  redis:
    container_name: scp-redis-test
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    volumes: !reset []  # Clear all volumes from base
    tmpfs:
      - /data
    restart: "no"

  postgres:
    container_name: scp-postgres-test
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    environment:
      POSTGRES_DB: scp_test
      POSTGRES_USER: scp_test
      POSTGRES_PASSWORD: scp_test_password
      PGDATA: /tmp/pgdata  # Use tmp directory instead of persistent volume
    volumes:
      # Mount entire migrations directory - all .sql files run in alphabetical order
      - ./migrations:/docker-entrypoint-initdb.d:ro
    restart: "no"
    healthcheck:
      # Verify postgres is ready AND migrations have run (check for 'candles' table)
      test: ["CMD-SHELL", "pg_isready -U scp_test -d scp_test && psql -U scp_test -d scp_test -c '\\dt candles' | grep -q candles"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Service overrides to use test database credentials and settings
  data-adapter:
    container_name: scp-data-adapter-test
    environment:
      SERVICE_MODE: paper
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://scp_test:scp_test_password@postgres:5432/scp_test
      DATA_PROVIDER: ib
      IB_HOST: ${IB_HOST:-host.docker.internal}
      IB_PORT: ${IB_PORT:-4002}
      IB_CLIENT_ID: ${IB_CLIENT_ID:-1}
      IB_GC_CONTRACT: ${IB_GC_CONTRACT:-GC}
      IB_DXY_CONTRACT: ${IB_DXY_CONTRACT:-DX}
      SESSION_FILTER_ENABLED: "true"
      GAP_BACKFILL_ENABLED: "true"
      RECONNECT_MAX_RETRIES: 10
      RECONNECT_BASE_DELAY: 1.0
      RECONNECT_MAX_DELAY: 60.0
      LOG_LEVEL: INFO
    restart: "no"

  feature-engine:
    container_name: scp-feature-engine-test
    environment:
      SERVICE_MODE: test
      DATABASE_URL: postgresql://scp_test:scp_test_password@postgres:5432/scp_test
      LOG_LEVEL: INFO
    restart: "no"

  htf-bias:
    container_name: scp-htf-bias-test
    environment:
      SERVICE_MODE: test
      DATABASE_URL: postgresql://scp_test:scp_test_password@postgres:5432/scp_test
      LOG_LEVEL: INFO
    restart: "no"

  bot-core:
    container_name: scp-bot-core-test
    environment:
      SERVICE_MODE: test
      DATABASE_URL: postgresql://scp_test:scp_test_password@postgres:5432/scp_test
      LOG_LEVEL: INFO
    restart: "no"

  execution:
    container_name: scp-execution-test
    environment:
      SERVICE_MODE: test
      DATABASE_URL: postgresql://scp_test:scp_test_password@postgres:5432/scp_test
      BROKER_MODE: paper
      LOG_LEVEL: INFO
    restart: "no"

  # Override Grafana to use test database credentials
  grafana:
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/operations.json
      - POSTGRES_DB=scp_test
      - POSTGRES_USER=scp_test
      - POSTGRES_PASSWORD=scp_test_password
    restart: "no"

# Clear volumes from base infrastructure file
volumes:
  redis_data: null
  postgres_data: null

# Use test-specific network
networks:
  default:
    name: scp_test_network
