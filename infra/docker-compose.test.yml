# Test overrides for docker-compose.yml + docker-compose.services.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.test.yml up
# Ephemeral containers for CI/testing - no persistent volumes

services:
  redis:
    container_name: scp-redis-test
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    volumes: !reset []  # Clear all volumes from base
    tmpfs:
      - /data
    restart: "no"

  postgres:
    container_name: scp-postgres-test
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    environment:
      POSTGRES_DB: scp_test
      POSTGRES_USER: scp_test
      POSTGRES_PASSWORD: scp_test_password
    volumes: !reset
      - ./migrations:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"
    healthcheck:
      # Verify database is ready AND migrations have run (check for 'candles' table)
      test: ["CMD-SHELL", "pg_isready -U scp_test -d scp_test && psql -U scp_test -d scp_test -c '\\dt candles' | grep -q candles"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Service overrides to use test database credentials
  data-adapter:
    container_name: scp-data-adapter-test
    environment:
      DATABASE_URL: postgresql://scp_test:scp_test_password@postgres:5432/scp_test
    restart: "no"

  feature-engine:
    container_name: scp-feature-engine-test
    environment:
      DATABASE_URL: postgresql://scp_test:scp_test_password@postgres:5432/scp_test
    restart: "no"

  htf-bias:
    container_name: scp-htf-bias-test
    environment:
      DATABASE_URL: postgresql://scp_test:scp_test_password@postgres:5432/scp_test
    restart: "no"

  bot-core:
    container_name: scp-bot-core-test
    environment:
      DATABASE_URL: postgresql://scp_test:scp_test_password@postgres:5432/scp_test
    restart: "no"

  execution:
    container_name: scp-execution-test
    environment:
      DATABASE_URL: postgresql://scp_test:scp_test_password@postgres:5432/scp_test
    restart: "no"

volumes:
  redis_data: null
  postgres_data: null

networks:
  default:
    name: scp_test_network
