# Development Environment Overrides
# Usage: docker compose -f docker-compose.infra.yml -f docker-compose.services.yml -f docker-compose.dev.yml up --build
#
# Features:
# - Debug logging enabled
# - Verbose Postgres query logging
# - Mock data provider (no external dependencies)
# - Development database
# - Session filtering disabled

services:
  redis:
    command: redis-server --appendonly yes --loglevel debug

  postgres:
    environment:
      POSTGRES_DB: scp_dev
      POSTGRES_USER: scp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scp_dev_password}
    command: 
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Mount entire migrations directory - all .sql files run in alphabetical order
      - ./migrations:/docker-entrypoint-initdb.d:ro

  data-adapter:
    container_name: scp-data-adapter-dev
    environment:
      SERVICE_MODE: dev
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp_dev
      DATA_PROVIDER: mock
      MOCK_DATA_PATH: ${MOCK_DATA_PATH:-/app/data}
      SESSION_FILTER_ENABLED: "false"
      GAP_BACKFILL_ENABLED: "false"
      LOG_LEVEL: DEBUG

  feature-engine:
    container_name: scp-feature-engine-dev
    environment:
      SERVICE_MODE: dev
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp_dev
      LOG_LEVEL: DEBUG

  htf-bias:
    container_name: scp-htf-bias-dev
    environment:
      SERVICE_MODE: dev
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp_dev
      LOG_LEVEL: DEBUG

  bot-core:
    container_name: scp-bot-core-dev
    environment:
      SERVICE_MODE: dev
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp_dev
      SESSION_VALIDATION_ENABLED: "false"
      LOG_LEVEL: DEBUG

  execution:
    container_name: scp-execution-dev
    environment:
      SERVICE_MODE: dev
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp_dev
      BROKER_MODE: paper
      LOG_LEVEL: DEBUG

volumes:
  postgres_dev_data:
    name: scp_postgres_dev_data
