# Full stack with all microservices
# Usage: docker-compose -f docker-compose.yml -f docker-compose.services.yml up --build
#
# This extends docker-compose.yml (Redis + PostgreSQL) with all SCP microservices.
# Build context is ../services/ so Dockerfiles can access shared/ library.

services:
  data-adapter:
    build:
      context: ../services
      dockerfile: data-adapter/Dockerfile
    container_name: scp-data-adapter
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp
      DATABENTO_API_KEY: ${DATABENTO_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  feature-engine:
    build:
      context: ../services
      dockerfile: feature-engine/Dockerfile
    container_name: scp-feature-engine
    ports:
      - "8002:8002"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      data-adapter:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  htf-bias:
    build:
      context: ../services
      dockerfile: htf-bias/Dockerfile
    container_name: scp-htf-bias
    ports:
      - "8003:8003"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      feature-engine:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  bot-core:
    build:
      context: ../services
      dockerfile: bot-core/Dockerfile
    container_name: scp-bot-core
    ports:
      - "8004:8004"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ../config:/app/bot-core/config:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      feature-engine:
        condition: service_healthy
      htf-bias:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  execution:
    build:
      context: ../services
      dockerfile: execution/Dockerfile
    container_name: scp-execution
    ports:
      - "8005:8005"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp
      BROKER_MODE: ${BROKER_MODE:-paper}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      bot-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

