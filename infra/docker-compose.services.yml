# Microservices Build Definitions
# This file defines all microservice builds without environment-specific settings
# Usage: Always compose with infra + services + environment overlay:
#   docker compose -f docker-compose.infra.yml -f docker-compose.services.yml -f docker-compose.dev.yml up

services:
  data-adapter:
    build:
      context: ../services
      dockerfile: data-adapter/Dockerfile
    container_name: scp-data-adapter
    ports:
      - "8001:8001"
    environment:
      SERVICE_MODE: ${SERVICE_MODE:-dev}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  feature-engine:
    build:
      context: ../services
      dockerfile: feature-engine/Dockerfile
    container_name: scp-feature-engine
    ports:
      - "8002:8002"
    environment:
      SERVICE_MODE: ${SERVICE_MODE:-dev}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      data-adapter:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  htf-bias:
    build:
      context: ../services
      dockerfile: htf-bias/Dockerfile
    container_name: scp-htf-bias
    ports:
      - "8003:8003"
    environment:
      SERVICE_MODE: ${SERVICE_MODE:-dev}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      feature-engine:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  bot-core:
    build:
      context: ../services
      dockerfile: bot-core/Dockerfile
    container_name: scp-bot-core
    ports:
      - "8004:8004"
    environment:
      SERVICE_MODE: ${SERVICE_MODE:-dev}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp
    volumes:
      - ../config:/app/bot-core/config:ro
      - ../config:/config:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      feature-engine:
        condition: service_healthy
      htf-bias:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  execution:
    build:
      context: ../services
      dockerfile: execution/Dockerfile
    container_name: scp-execution
    ports:
      - "8005:8005"
    environment:
      SERVICE_MODE: ${SERVICE_MODE:-dev}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://scp:${POSTGRES_PASSWORD:-scp_dev_password}@postgres:5432/scp
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      bot-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Override Prometheus to scrape Docker service names (not host.docker.internal)
  prometheus:
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
