services:
  redis:
    image: redis:7-alpine
    container_name: scp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: scp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scp
      POSTGRES_USER: scp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scp_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount entire migrations directory - all .sql files run in alphabetical order
      - ./migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      # Verify database is ready AND migrations have run (check for 'candles' table)
      test: ["CMD-SHELL", "pg_isready -U scp -d scp && psql -U scp -d scp -c '\\dt candles' | grep -q candles"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: scp-prometheus
    ports:
      - "9090:9090"
    volumes:
      # Default: Local development (services on host.docker.internal)
      # Override with prometheus.yml in environment files when services run in Docker
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:10.2.0
    container_name: scp-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/operations.json
      - POSTGRES_DB=scp
      - POSTGRES_USER=scp
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-scp_dev_password}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus
      - postgres
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway
    restart: always
    environment:
      TWS_USERID: ${IB_USERNAME}
      TWS_PASSWORD: ${IB_PASSWORD}
      TRADING_MODE: ${IB_TRADING_MODE:-paper}
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:-}
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: "11:59 PM"
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      TIME_ZONE: ${TIME_ZONE:-America/New_York}
      READ_ONLY_API: "no"
      EXISTING_SESSION_DETECTED_ACTION: "primary"
    ports:
      - "127.0.0.1:5900:5900"  # VNC for 2FA (localhost only)
    expose:
      - "4003"  # Live trading API
      - "4004"  # Paper trading API
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/4004) 2>/dev/null || (echo > /dev/tcp/localhost/4003) 2>/dev/null'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  redis_data:
    name: scp_redis_data
  postgres_data:
    name: scp_postgres_data
  prometheus_data:
    name: scp_prometheus_data
  grafana_data:
    name: scp_grafana_data

networks:
  default:
    name: scp_network

