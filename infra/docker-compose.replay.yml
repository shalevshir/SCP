# Replay Mode Environment Overrides
# Usage: docker compose -f docker-compose.infra.yml -f docker-compose.services.yml -f docker-compose.replay.yml up --build
#
# Features:
# - Session filtering disabled (for historical data)
# - Session validation disabled (for historical data)
# - Mock data provider with historical data replay
# - Paper broker
# - Faster processing

services:
  data-adapter:
    container_name: scp-data-adapter-replay
    environment:
      SERVICE_MODE: replay
      DATA_PROVIDER: mock
      SESSION_FILTER_ENABLED: "false"
      LOG_LEVEL: INFO

  feature-engine:
    container_name: scp-feature-engine-replay
    environment:
      SERVICE_MODE: replay
      WARMUP_ENABLED: "true"
      LOG_LEVEL: INFO

  htf-bias:
    container_name: scp-htf-bias-replay
    environment:
      SERVICE_MODE: replay
      LOG_LEVEL: INFO

  bot-core:
    container_name: scp-bot-core-replay
    environment:
      SERVICE_MODE: replay
      SESSION_VALIDATION_ENABLED: "false"  # Disable for historical data
      LOG_LEVEL: INFO

  execution:
    container_name: scp-execution-replay
    environment:
      SERVICE_MODE: replay
      BROKER_MODE: paper
      LOG_LEVEL: INFO

  # Override Prometheus to scrape Docker service names (not host.docker.internal)
  prometheus:
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
