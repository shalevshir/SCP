services:
  redis:
    image: redis:7-alpine
    container_name: scp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: scp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scp
      POSTGRES_USER: scp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scp_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      # Verify database is ready AND migrations have run (check for 'candles' table)
      test: ["CMD-SHELL", "pg_isready -U scp -d scp && psql -U scp -d scp -c '\\dt candles' | grep -q candles"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  redis_data:
    name: scp_redis_data
  postgres_data:
    name: scp_postgres_data

networks:
  default:
    name: scp_network

