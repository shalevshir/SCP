# Paper Trading Overlay for Live Data + IB Integration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.paper-trading.yml up -d
#
# This overlay configures services for live paper trading:
# - Data Adapter: Uses Databento live data (requires DATABENTO_API_KEY)
# - Execution: Uses IB paper trading broker (requires IB Gateway/TWS running on host)
#
# Prerequisites:
# 1. DATABENTO_API_KEY environment variable set
# 2. IB Gateway/TWS running on host machine in paper trading mode
# 3. IB API enabled in TWS/Gateway settings

services:
  data-adapter:
    environment:
      # Use Databento for live data
      DATA_PROVIDER: databento
      DATABENTO_API_KEY: ${DATABENTO_API_KEY}
      DATABENTO_DATASET: ${DATABENTO_DATASET:-GLBX.MDP3}
      DATABENTO_GC_SYMBOL: ${DATABENTO_GC_SYMBOL:-GC.FUT}
      DATABENTO_DXY_SYMBOL: ${DATABENTO_DXY_SYMBOL:-DX.FUT}
      # Enable session filtering for live trading hours
      SESSION_FILTER_ENABLED: "true"
      # Enable gap backfill
      GAP_BACKFILL_ENABLED: "true"
      # Connection resilience
      RECONNECT_MAX_RETRIES: 10
      RECONNECT_BASE_DELAY: 1.0
      RECONNECT_MAX_DELAY: 60.0

  execution:
    environment:
      # Use IB paper trading broker
      BROKER_MODE: ib_paper
      # IB connection settings (connect to host machine)
      # On Mac/Windows: use host.docker.internal
      # On Linux: use host's IP address or 172.17.0.1 (default Docker bridge)
      IB_HOST: ${IB_HOST:-host.docker.internal}
      IB_PORT: ${IB_PORT:-7497}
      IB_CLIENT_ID: ${IB_CLIENT_ID:-1}
      IB_ACCOUNT: ${IB_ACCOUNT:-}
    # Add network_mode: host on Linux if host.docker.internal doesn't work
    # network_mode: host  # Uncomment on Linux if connection fails
    extra_hosts:
      # Ensure host.docker.internal resolves (works on Mac/Windows by default)
      - "host.docker.internal:host-gateway"
