name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install project dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system pytest pytest-xdist pytest-cov pyyaml pydantic
      
      - name: Run tests with coverage
        run: |
          pytest --cov=common --cov=data_layer --cov=src --cov=feature_engine --cov=backtester --cov=rule_engine --cov-report=xml --cov-report=term --junitxml=pytest-results.xml -v
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 30
      
      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: logs/
          retention-days: 7
      
      - name: Coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
      
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always() && github.event_name == 'pull_request'
        with:
          name: Test Results
          path: pytest-results.xml
          reporter: java-junit
          fail-on-error: true

  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install project and linting dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system ruff mypy types-PyYAML
      
      - name: Run ruff linter
        run: ruff check .
      
      - name: Run mypy type checker
        run: |
          mypy --install-types --non-interactive common/ data_layer/ || true
        continue-on-error: true

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install project and formatting tools
        run: |
          uv pip install --system -e .
          uv pip install --system black isort
      
      - name: Check black formatting
        run: black --check .
      
      - name: Check isort import ordering
        run: isort --check-only .

  service-tests:
    name: Service Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - shared
          - data-adapter
          - feature-engine
          - htf-bias
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            services/${{ matrix.service }}/.venv
          key: poetry-${{ matrix.service }}-${{ runner.os }}-${{ hashFiles(format('services/{0}/poetry.lock', matrix.service)) }}
          restore-keys: |
            poetry-${{ matrix.service }}-${{ runner.os }}-
      
      - name: Install shared library
        run: |
          cd services/shared
          poetry install --no-interaction --no-ansi
      
      - name: Install service dependencies
        run: |
          cd services/${{ matrix.service }}
          poetry install --no-interaction --no-ansi
      
      - name: Run service tests
        run: |
          cd services/${{ matrix.service }}
          poetry run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term --junitxml=pytest-results.xml
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          retention-days: 30
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/pytest-results.xml
          retention-days: 30

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: false  # Disabled until tests are implemented
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Start infrastructure
        run: |
          # Will use docker-compose to start Redis + PostgreSQL
          docker compose -f infra/docker-compose.yml up -d
          sleep 5
      
      - name: Run integration tests
        run: |
          # Placeholder for integration tests
          echo "Integration tests not yet implemented"
      
      - name: Stop infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.yml down

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: false  # Disabled until tests are implemented
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Start all services
        run: |
          # Will start full microservices stack
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.services.yml up -d
          sleep 10
      
      - name: Run E2E tests
        run: |
          # Placeholder for E2E tests
          echo "E2E tests not yet implemented"
      
      - name: Stop all services
        if: always()
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.services.yml down

